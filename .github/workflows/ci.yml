name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: ./scripts/setup-ubuntu.sh

      - name: Configure
        run: cmake --preset ci

      - name: Build
        run: |
          set -o pipefail
          cmake --build --preset ci 2>&1 | tee build.log

      - name: Fusion bridge add-in tests
        run: |
          set -o pipefail
          python3 -m unittest discover -s tools/fusion-bridge/tests 2>&1 | tee bridge.log

      - name: Test
        run: |
          set -o pipefail
          ctest --preset ci 2>&1 | tee ctest.log

      # Job logs need a GitHub login; annotations are public. Publish the
      # compiler errors or failing test output so they can be read without signing in.
      - name: Annotate failures
        if: failure()
        run: |
          if [ -f ctest.log ]; then src=ctest.log
          elif grep -q -E 'FAILED|Error' bridge.log 2>/dev/null; then src=bridge.log
          elif [ -f build.log ]; then
            grep -n -A6 -E 'error|FAILED' build.log > errors.log || cp build.log errors.log
            src=errors.log
          else exit 0; fi
          tail -c 60000 "$src" | grep -v -E '^\s*$' | tail -n 400 > tail.log
          split -l 40 tail.log part_
          for f in part_*; do
            msg=$(sed -e 's/%/%25/g' "$f" | awk 'BEGIN{ORS="%0A"} {print}')
            echo "::error title=$src ($f)::$msg"
          done
